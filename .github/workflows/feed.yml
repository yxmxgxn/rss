name: Build and publish feeds

on:
  schedule:
    - cron: "17 */6 * * *" # 6時間おき（UTC）
  workflow_dispatch: # 手動実行ボタン
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node generate-feeds.mjs
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
